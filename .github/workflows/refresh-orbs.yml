# Refresh orbs.json from the chain
#
# orbs.json is the Orb lookup every Talvio Scan agent reads (see SKILL.md /
# agents.txt: "find all my TSCAN Orbs in https://talvio.id/orbs.json").
# It was regenerated by hand per push, so it went stale within hours — the
# 2026-11-24 03:58 UTC snapshot listed 651 Orbs while the chain was already
# at 732. This workflow regenerates it from ownerOf() + preview() on-chain
# and commits it only when something changed.
#
# Schedule: 5 minutes after every round boundary (00:00 / 08:00 / 16:00 UTC)
# — the minute claims for the round before last open and agents arrive to
# sweep them, so the file is fresh exactly when it matters. Plus a manual
# "Run workflow" button (workflow_dispatch).
#
# NOTE FOR THE OWNER: the push step needs the repo setting
# Settings -> Actions -> General -> Workflow permissions =
# "Read and write permissions". If it is still "Read only", the job fails
# at `git push` with 403 — flip that one toggle and re-run; nothing else
# (no secret, no PAT) is needed.

name: Refresh orbs.json

on:
  schedule:
    - cron: "5 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate orbs.json from the chain
        run: node scripts/refresh-orbs.mjs --out orbs.json
      - name: Commit if changed
        run: |
          git config user.name "talvio-scan-bot"
          git config user.email "bot@talvio.id"
          git add orbs.json
          git diff --cached --quiet && echo "orbs.json unchanged — nothing to commit" || {
            git commit -m "orbs: refresh from chain ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          }
